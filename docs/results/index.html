<body>
<div id="osb-explorer">
<style>
#osb-explorer{color-scheme:light dark;--osb-bg:light-dark(#ffffff,#141b23);--osb-soft:light-dark(#f3f6f9,#202b36);--osb-text:light-dark(#1c344a,#e2edf7);--osb-muted:light-dark(#54687b,#a8bbcd);--osb-line:light-dark(#dce4ec,#374756);--osb-blue:light-dark(#176d9d,#68bbea);--osb-green:light-dark(#207965,#73c9b1);--osb-orange:light-dark(#ab641c,#e8b378);font:14px/1.55 system-ui,sans-serif;background:var(--osb-bg);color:var(--osb-text);border-radius:14px;overflow:hidden}
#osb-explorer *{box-sizing:border-box}#osb-explorer button,#osb-explorer select{font:inherit;color:inherit;background:var(--osb-bg);border:1px solid var(--osb-line);border-radius:7px;padding:7px 11px;cursor:pointer}#osb-explorer button[aria-pressed=true]{background:var(--osb-text);color:var(--osb-bg)}#osb-explorer header{padding:18px 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--osb-line);gap:12px;flex-wrap:wrap}#osb-explorer .brand{font-weight:650;letter-spacing:.02em}#osb-explorer .brand small{font-weight:400;color:var(--osb-muted);margin-left:12px}#osb-explorer main{padding:24px}#osb-explorer h1{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:650}#osb-explorer .meta{color:var(--osb-muted);font-size:12px}#osb-explorer .intro{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:22px}#osb-explorer .tag{padding:4px 8px;background:var(--osb-soft);border-radius:4px;white-space:nowrap;font-size:12px}#osb-explorer .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}#osb-explorer label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--osb-muted)}#osb-explorer label select{min-width:145px;color:var(--osb-text);font-size:14px}#osb-explorer .view-switch{display:flex;gap:5px;margin-left:auto}#osb-explorer details{margin-bottom:14px}#osb-explorer summary{cursor:pointer;font-size:12px;color:var(--osb-muted)}#osb-explorer .models{display:flex;gap:10px 18px;flex-wrap:wrap;padding-top:10px}#osb-explorer .models label{flex-direction:row;align-items:center;color:var(--osb-text)}#osb-explorer .status{border-top:1px solid var(--osb-line);padding:13px 0;font-size:12px;color:var(--osb-muted)}#osb-explorer .table-wrap{overflow-x:auto}#osb-explorer table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}#osb-explorer th{font-size:12px;font-weight:500;color:var(--osb-muted);text-align:right;white-space:nowrap;padding:10px}#osb-explorer td{padding:13px 10px;border-bottom:1px solid var(--osb-line);text-align:right;white-space:nowrap}#osb-explorer td:first-child,#osb-explorer th:first-child{text-align:left}#osb-explorer .group td{background:var(--osb-soft);font-size:12px;padding:8px 10px;border:0;text-align:left;color:var(--osb-muted)}#osb-explorer .model-button{border:0;padding:0;background:transparent;font-weight:550;color:var(--osb-blue)}#osb-explorer .measure{background:linear-gradient(to right,color-mix(in srgb,var(--osb-blue) 10%,transparent) var(--fill),transparent var(--fill));padding:3px 6px;border-radius:3px}#osb-explorer .selected td{background:var(--osb-soft)}#osb-explorer .detail{margin-top:20px;background:var(--osb-soft);padding:17px 20px;border-radius:8px}#osb-explorer .detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px}#osb-explorer h2{margin:0;font-size:17px;font-weight:600}#osb-explorer .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:13px}#osb-explorer .detail-grid div{font-size:13px}#osb-explorer .detail-grid small{display:block;color:var(--osb-muted);margin-bottom:3px}#osb-explorer .detail-note{font-size:12px;color:var(--osb-muted);margin-top:12px}#osb-explorer footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--osb-muted);margin-top:18px}#osb-explorer .plot-controls{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:12px}#osb-explorer .legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--osb-muted)}#osb-explorer svg{display:block;width:100%;overflow:visible}#osb-explorer svg text{fill:var(--osb-text);font:12px system-ui,sans-serif}#osb-explorer .empty{padding:25px;color:var(--osb-muted);text-align:center}#osb-explorer [hidden]{display:none!important}@media(max-width:600px){#osb-explorer main{padding:16px}#osb-explorer header{padding:14px 16px}#osb-explorer h1{font-size:23px}#osb-explorer .intro{flex-direction:column;gap:10px}#osb-explorer .view-switch{margin-left:0}#osb-explorer .detail-grid{grid-template-columns:1fr}#osb-explorer label select{min-width:130px;max-width:100%}#osb-explorer .controls>label{flex:1}#osb-explorer button,#osb-explorer select{min-height:42px}#osb-explorer .models label{min-height:35px}}
#osb-explorer .table-wrap{border:1px solid var(--osb-line);border-radius:10px}
#osb-explorer .task-heading th{padding:13px 12px;font-weight:600;text-align:center;letter-spacing:.03em;background:var(--osb-soft);border-bottom:1px solid var(--osb-line)}
#osb-explorer .task-heading th:first-child{text-align:left}#osb-explorer .qa-heading{color:var(--osb-blue)}#osb-explorer .pro-heading{color:var(--osb-green)}
#osb-explorer th .sort-head{border:0;background:transparent;padding:2px 0;font-size:12px;color:var(--osb-muted);border-radius:0;text-align:right}
#osb-explorer th .sort-head.active{color:var(--osb-blue);font-weight:650}#osb-explorer .unit{font-size:11px;color:var(--osb-muted);font-weight:400}
#osb-explorer .group td{background:var(--osb-bg);padding:18px 12px 8px;border-top:1px solid var(--osb-line);font-size:11px;letter-spacing:.025em}
#osb-explorer .group:first-child td{border-top:0}#osb-explorer tbody tr:not(.group):hover td{background:var(--osb-soft)}
#osb-explorer .metric-start{border-left:1px solid var(--osb-line)}#osb-explorer .measure{background:none;padding:0;font-weight:400}#osb-explorer .measure.best{font-weight:650;color:var(--osb-blue)}
#osb-explorer .model-button{color:var(--osb-text)}
#osb-explorer .plot-caption{font-size:12px;color:var(--osb-muted);margin:8px 0 16px}
#osb-explorer .point-label{paint-order:stroke;stroke:var(--osb-bg);stroke-width:4px;stroke-linejoin:round}
#osb-explorer .point-label.selected{font-weight:650}#osb-explorer .legend{margin-bottom:14px}
</style>
<header><div class="brand">TRACE <small>Leaderboard</small></div><nav aria-label="Language"><a href="index.zh-CN.html">简体中文</a></nav><span class="tag">Offline benchmark</span></header>
<main>
<div class="intro"><div><h1>TRACE Leaderboard</h1><div class="meta">Benchmark snapshot · eight configurations · v1.1.0 standard cohort</div></div><span class="tag">1 FPS · Proactive W = 5s</span></div>
<div class="controls">
<label>Task<select id="osb-task"><option value="all">Cross-task scorecard</option><option value="qa">QA</option><option value="pro">Proactive</option></select></label>
<label>Comparison group<select id="osb-group"></select></label>
<label id="osb-sort-wrap">Sort within group · visible columns<select id="osb-sort"></select></label>
<div class="view-switch"><button type="button" id="osb-table-button" aria-pressed="true">Scorecard</button><button type="button" id="osb-plot-button" aria-pressed="false">Trade-off plot</button></div>
</div>
<details><summary>Models and metric columns</summary><div class="models" id="osb-models"></div><div class="models" id="osb-columns"></div></details>
<div class="status" id="osb-status" aria-live="polite"></div>
<div id="osb-table-view" class="table-wrap"><table><thead id="osb-head"></thead><tbody id="osb-body"></tbody></table></div>
<div id="osb-plot-view" hidden><div class="plot-controls"><label>X axis · operational/error metric<select id="osb-x"></select></label><label>Y axis · quality metric<select id="osb-y"></select></label></div><div class="legend"><span>● Model + Adapter</span><span>■ End-to-end system</span><span>▲ Native duplex diagnostic</span></div><div id="osb-chart"></div><div class="plot-caption" id="osb-chart-caption"></div><div class="meta" id="osb-plot-note"></div></div>
<section class="detail" id="osb-detail" hidden aria-live="polite"></section>
</main>
<script>
(()=>{
const root=document.getElementById('osb-explorer');
const el=id=>root.querySelector('#osb-'+id);
const metrics={qa:{label:'QA Accuracy',unit:'%',up:true,task:'qa'},qc:{label:'QA Completion',unit:'%',up:true,task:'qa'},qlat:{label:'Response Latency',unit:'ms',up:false,task:'qa'},qimg:{label:'Submitted images',unit:'image',up:false,task:'qa'},qtok:{label:'Output tokens',unit:'token',up:false,task:'qa'},qinv:{label:'Invalid output',unit:'%',up:false,task:'qa'},pacc:{label:'In-window Accuracy',unit:'%',up:true,task:'pro'},pdelay:{label:'Median Response Delay',unit:'s',up:false,task:'pro'},pfa:{label:'False-alarm Rate',unit:'%',up:false,task:'pro'},pmiss:{label:'Miss Rate',unit:'%',up:false,task:'pro'},pimg:{label:'Submitted images',unit:'image',up:false,task:'pro'},ptok:{label:'Output tokens',unit:'token',up:false,task:'pro'},pc:{label:'Proactive Record Completion',unit:'%',up:true,task:'pro'}};
const data=[
{name:'LiveCC',qa:65.19,qc:93.88,pc:87.71,qlat:165.2,qimg:21917,qtok:146064,qinv:6.12,pacc:12.98,pdelay:1.08,pfa:65.0,pmiss:.31,pimg:23243,ptok:78478,qaGroup:'adapter',proGroup:'adapter',boundary:'model_adapter',note:'Native persistent session with autonomous Proactive output. Delay coverage is 892 observed onsets / 1,266 answered windows (70.5%).'},
{name:'AURA',qa:73.83,qc:99.88,pc:99.26,qlat:819.7,qimg:31170,qtok:2469,qinv:.60,pacc:7.92,pdelay:1.15,pfa:59.1,pmiss:47.64,pimg:439400,ptok:50957,qaGroup:'prefix',proGroup:'adapter',boundary:'model_adapter',note:'QA uses prefix input at query time. Proactive uses persistent incremental state and autonomous output; delay coverage is 357 / 665 (53.7%).'},
{name:'MOSS-VL',qa:75.03,qc:99.88,pc:100,qlat:374.6,qimg:30835,qtok:39768,qinv:.84,pacc:8.05,pdelay:.33,pfa:41.1,pmiss:47.24,pimg:34520,ptok:74672,qaGroup:'adapter',proGroup:'adapter',boundary:'model_adapter',note:'Native real-time session. MOSS submitted-image count is a 34,520 unique-frame proxy; delay coverage is 304 / 670 (45.4%).'},
{name:'MOSS-Preview',qa:65.07,qc:100,pc:100,qlat:138.1,qimg:30835,qtok:42206,qinv:1.92,pacc:4.45,pdelay:.20,pfa:77.7,pmiss:35.67,pimg:34520,ptok:193517,qaGroup:'adapter',proGroup:'adapter',boundary:'model_adapter',note:'Native real-time session. MOSS submitted-image count is a 34,520 unique-frame proxy; delay coverage is 485 / 817 (59.4%).'},
{name:'ThinkStream',qa:61.46,qc:100,pc:100,qlat:411,qimg:30835,qtok:349476,qinv:0,pacc:.52,pdelay:2.14,pfa:73.6,pmiss:68.43,pimg:32783,ptok:373897,qaGroup:'adapter',proGroup:'adapter',boundary:'model_adapter',note:'Native two-frame blocks and persistent state; the tested Proactive configuration has an end-block commit limitation. Delay coverage is 70 / 401 (17.5%).'},
{name:'VideoLLM-Online',qa:2.64,qc:100,pc:100,qlat:681.1,qimg:30835,qtok:39047,qinv:95.32,pacc:.18,pdelay:.20,pfa:82.4,pmiss:60.39,pimg:32783,ptok:42162,qaGroup:'adapter',proGroup:'adapter',boundary:'model_adapter',note:'Native per-frame visual representations and persistent KV state. QA invalid output is 95.32%; delay coverage is 34 / 503 (6.8%).'},
{name:'MiniCPM-O (native duplex)',qa:2.40,qc:100,pc:null,qlat:489.5,qimg:30835,qtok:24591,qinv:93.52,pacc:.51,pdelay:1.24,pfa:80.3,pmiss:65.43,pimg:32617,ptok:23636,qaGroup:'adapter',proGroup:'adapter',boundary:'model_adapter_diagnostic',diagnostic:true,note:'Native duplex diagnostic. Delay coverage is 108 / 439 (24.6%); supplementary Proactive completion and trigger breakdown are unavailable.'},
{name:'JoyAI',qa:67.47,qc:91.36,pc:95.58,qlat:876.1,qimg:17235,qtok:2286,qinv:8.52,pacc:17.08,pdelay:1.12,pfa:50.5,pmiss:32.13,pimg:313658,ptok:797954,qaGroup:'system',proGroup:'system',boundary:'end_to_end_system',note:'End-to-end system including memory and scheduling; delay coverage is 401 / 862 (46.5%).'}];
const groupNames={adapter:'Native model + Adapter · autonomous',system:'End-to-end system',prefix:'Non-native prefix-input'};
let task='all',view='table',selected=null;
const shown=new Set(data.map(d=>d.name)),columns=new Set(['qa','qc','qlat','pacc','pdelay','pfa','pmiss']);
const fmt=(v,k)=>v===null?'N/A':['qimg','qtok','pimg','ptok'].includes(k)?v.toLocaleString('en-US'):v.toFixed(k==='qlat'||k==='pdelay'?2:2)+(metrics[k].unit==='%'?'%':'');
const group=d=>task==='qa'?d.qaGroup:d.proGroup;
const validKeys=()=>Object.keys(metrics).filter(k=>task==='all'||metrics[k].task===task);
const visibleKeys=()=>validKeys().filter(k=>columns.has(k));
const xKeys=()=>task==='qa'?['qlat','qc','qtok','qimg','qinv']:['pdelay','pfa','pmiss','ptok','pimg'];
const yKeys=()=>task==='qa'?['qa']:['pacc'];
function options(select,keys,value){select.replaceChildren(...keys.map(k=>{const o=document.createElement('option');o.value=k;o.textContent=metrics[k].label+' ('+metrics[k].unit+') '+(metrics[k].up?'↑':'↓');return o}));select.value=keys.includes(value)?value:keys[0]}
function setup(){
const groups=task==='qa'?['adapter','system','prefix']:['adapter','system'];
el('group').innerHTML='<option value="all">All groups (shown separately)</option>'+groups.map(g=>'<option value="'+g+'">'+groupNames[g]+'</option>').join('');
const keys=validKeys();options(el('sort'),visibleKeys(),task==='pro'?'pacc':'qa');options(el('x'),xKeys(),task==='qa'?'qlat':'pdelay');options(el('y'),yKeys(),task==='qa'?'qa':'pacc');
el('columns').replaceChildren(...keys.map(k=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=columns.has(k);c.addEventListener('change',()=>{c.checked?columns.add(k):columns.delete(k);render()});l.append(c,metrics[k].label);return l}));render();}
el('models').replaceChildren(...data.map(d=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.addEventListener('change',()=>{c.checked?shown.add(d.name):shown.delete(d.name);render()});l.append(c,d.name);return l}));
function rows(){return data.filter(d=>shown.has(d.name)&&(el('group').value==='all'||group(d)===el('group').value))}
function detail(d){selected=d;const panel=el('detail');panel.hidden=false;panel.innerHTML='<div class="detail-top"><h2>'+d.name+'</h2><button type="button">Close</button></div><div class="detail-grid"><div><small>QA input</small>'+groupNames[d.qaGroup]+'</div><div><small>Proactive state / trigger</small>'+groupNames[d.proGroup]+' · autonomous</div><div><small>QA / Proactive record completion</small>'+fmt(d.qc,'qc')+' / '+fmt(d.pc,'pc')+'</div></div><div class="detail-note">'+d.note+'</div>';panel.querySelector('button').onclick=()=>{selected=null;panel.hidden=true;render()};}
function render(){
const rs=rows(),ks=visibleKeys();options(el('sort'),ks,el('sort').value);el('sort').disabled=!ks.length;const sort=el('sort').value;
el('status').textContent=rs.length+' configurations · '+(task==='qa'?'833 records QA':task==='pro'?'407 standard Proactive records / 1,270 windows':'QA 833 records / Proactive 1,270 standard windows')+(view==='table'&&sort?' · within-group sort: '+metrics[sort].label+' order':'')+(task==='all'?' · grouped by declared boundary':'');
el('table-view').hidden=view!=='table';el('plot-view').hidden=view!=='plot';el('table-button').setAttribute('aria-pressed',view==='table');el('plot-button').setAttribute('aria-pressed',view==='plot');
el('sort-wrap').hidden=view!=='table';el('columns').hidden=view!=='table';
const qaKeys=ks.filter(k=>metrics[k].task==='qa'),proKeys=ks.filter(k=>metrics[k].task==='pro');
el('head').innerHTML='<tr class="task-heading"><th rowspan="2">Model configuration</th>'+(qaKeys.length?'<th class="qa-heading" colspan="'+qaKeys.length+'">QA <span class="unit">/ 833 records</span></th>':'')+(proKeys.length?'<th class="pro-heading" colspan="'+proKeys.length+'">PROACTIVE <span class="unit">/ 1,270 windows</span></th>':'')+'</tr><tr>'+ks.map((k,i)=>'<th class="'+(i===0||k===proKeys[0]?'metric-start':'')+'"><button type="button" class="sort-head '+(sort===k?'active':'')+'" data-sort="'+k+'">'+metrics[k].label+' '+(metrics[k].up?'↑':'↓')+'</button><br><span class="unit">'+metrics[k].unit+'</span></th>').join('')+'</tr>';
el('head').querySelectorAll('[data-sort]').forEach(btn=>btn.onclick=()=>{el('sort').value=btn.dataset.sort;render()});
const body=el('body');body.replaceChildren();
for(const g of (task==='qa'?['adapter','system','prefix']:['adapter','system'])){
const part=rs.filter(d=>group(d)===g).sort((a,b)=>!sort?0:a[sort]===null?1:b[sort]===null?-1:(metrics[sort].up?-1:1)*(a[sort]-b[sort]));if(!part.length)continue;
const tr=document.createElement('tr');tr.className='group';tr.innerHTML='<td colspan="'+(ks.length+1)+'">'+groupNames[g]+'</td>';body.append(tr);
for(const d of part){const row=document.createElement('tr');if(selected===d)row.className='selected';const first=document.createElement('td'),btn=document.createElement('button');btn.type='button';btn.className='model-button';btn.textContent=d.name;btn.onclick=()=>{detail(d);render()};first.append(btn);row.append(first);
for(const k of ks){const td=document.createElement('td');const values=part.map(p=>p[k]).filter(v=>v!==null),best=metrics[k].up?Math.max(...values):Math.min(...values);if(k===ks[0]||k===proKeys[0])td.className='metric-start';td.innerHTML='<span class="measure '+(values.length>1&&d[k]===best?'best':'')+'">'+fmt(d[k],k)+'</span>';row.append(td)}body.append(row)}
}
if(!rs.length)body.innerHTML='<tr><td colspan="'+(ks.length+1)+'" class="empty">No model configurations selected</td></tr>';
if(selected&&!rs.includes(selected)){selected=null;el('detail').hidden=true}
if(view==='plot')draw();
}
function draw(){
const host=el('chart'),xk=el('x').value,yk=el('y').value,rs=rows().filter(d=>d[xk]!==null&&d[yk]!==null),w=Math.max(280,host.clientWidth),h=w<600?550:430,l=65,r=w-22,t=20,b=h-75;
const xmax=Math.max(1,...rs.map(d=>d[xk]))*1.16,ymax=Math.max(1,...rs.map(d=>d[yk]))*1.17;
const x=v=>l+12+(r-l-24)*v/xmax,y=v=>b-12-(b-t-24)*v/ymax;
const points=rs.map((d,i)=>({d,i,x:x(d[xk]),y:y(d[yk])}));
const ctx=document.createElement('canvas').getContext('2d');ctx.font='12px system-ui';
const placed=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const overlaps=(a,b)=>a.x<b.x+b.w+5&&a.x+a.w+5>b.x&&a.y<b.y+b.h+5&&a.y+a.h+5>b.y;
for(const p of [...points].sort((a,b)=>a.y-b.y)){
const width=ctx.measureText(p.d.name).width+4, candidates=[];
for(let yy=t+10;yy<b-20;yy+=22){for(const xx of [p.x+15,p.x-width-15,l+8,r-width-8]){
const q={x:clamp(xx,l+7,r-width-7),y:yy,w:width,h:15};
if(placed.some(v=>overlaps(q,v)))continue;
if(points.some(v=>overlaps(q,{x:v.x-7,y:v.y-7,w:14,h:14})))continue;
const nx=clamp(p.x,q.x,q.x+q.w),ny=q.y+q.h/2;
candidates.push({...q,cost:Math.hypot(nx-p.x,ny-p.y)});
}}
candidates.sort((a,b)=>a.cost-b.cost);p.label=candidates[0]||{x:l+8,y:t+10+p.i*23,w:width,h:15};placed.push(p.label);
}
let svg='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+metrics[yk].label+' vs. '+metrics[xk].label+'：Each point is labeled with its model name"><rect data-chart-frame x="'+l+'" y="'+t+'" width="'+(r-l)+'" height="'+(b-t)+'" fill="none" stroke="var(--osb-line)"/>';
for(let i=0;i<=3;i++){const xv=xmax*i/3,yv=ymax*i/3;svg+='<line x1="'+l+'" y1="'+y(yv)+'" x2="'+r+'" y2="'+y(yv)+'" stroke="var(--osb-line)" opacity=".5"/><text x="'+x(xv)+'" y="'+(b+22)+'" text-anchor="middle">'+(xv>=1000?(xv/1000).toFixed(0)+'k':xv.toFixed(1))+'</text><text x="'+(l-10)+'" y="'+(y(yv)+4)+'" text-anchor="end">'+yv.toFixed(1)+'</text>';}
svg+='<text class="axis-title" data-axis="x" x="'+((l+r)/2)+'" y="'+(h-26)+'" text-anchor="middle">'+metrics[xk].label+' '+(metrics[xk].up?'↑':'↓')+'<tspan x="'+((l+r)/2)+'" dy="17">('+metrics[xk].unit+')</tspan></text><text class="axis-title" data-axis="y" transform="translate(17 '+((t+b)/2)+') rotate(-90)" text-anchor="middle">'+metrics[yk].label+' (%) ↑</text>';
for(const p of points){const q=p.label;svg+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+clamp(p.x,q.x,q.x+q.w)+'" y2="'+(q.y+q.h/2)+'" stroke="var(--osb-muted)" stroke-width=".8" opacity=".65"/>';}
points.forEach(p=>{const d=p.d,px=p.x,py=p.y,g=group(d),color=g==='system'?'var(--osb-green)':d.boundary==='model_adapter_diagnostic'?'var(--osb-orange)':'var(--osb-blue)';svg+='<g>';if(g==='system')svg+='<rect x="'+(px-5)+'" y="'+(py-5)+'" width="10" height="10" fill="'+color+'"/>';else if(d.boundary==='model_adapter_diagnostic')svg+='<polygon points="'+px+','+(py-6)+' '+(px-6)+','+(py+5)+' '+(px+6)+','+(py+5)+'" fill="'+color+'"/>';else svg+='<circle cx="'+px+'" cy="'+py+'" r="5" fill="'+color+'"/>';svg+='<circle data-point="'+p.i+'" cx="'+px+'" cy="'+py+'" r="18" fill="transparent"><title>'+d.name+' · '+fmt(d[xk],xk)+' / '+fmt(d[yk],yk)+'</title></circle><text data-label="'+p.i+'" class="point-label" x="'+p.label.x+'" y="'+(p.label.y+12)+'">'+d.name+'</text></g>';});svg+='</svg>';host.innerHTML=svg;
host.querySelectorAll('[data-point],[data-label]').forEach(p=>{p.style.cursor='pointer';p.onclick=()=>detail(rs[Number(p.dataset.point??p.dataset.label)])});
el('chart-caption').textContent=(metrics[xk].up?'Upper right: higher quality and completion.':'Upper left: higher quality and a lower selected operational metric.')+' Labels connect to the actual data points; points are not displaced to avoid overlap.';
const note=el('plot-note');note.replaceChildren();rs.forEach(d=>{const btn=document.createElement('button');btn.type='button';btn.textContent=d.name;btn.style.margin='4px';btn.onclick=()=>detail(d);note.append(btn)});const excluded=rows().length-rs.length;if(excluded)note.append(' · '+excluded+' configuration(s) missing selected metrics, omitted from plot');
}
el('task').onchange=()=>{task=el('task').value;if(task==='all')view='table';setup()};
el('group').onchange=render;el('sort').onchange=render;el('x').onchange=draw;el('y').onchange=draw;
el('table-button').onclick=()=>{view='table';render()};el('plot-button').onclick=()=>{view='plot';if(task==='all'){task='pro';el('task').value='pro';setup()}else render()};
new ResizeObserver(()=>{if(view==='plot')draw()}).observe(el('chart'));
setup();
})();
</script>
</div>
