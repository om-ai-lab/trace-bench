[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-bench"
version = "0.1.0"
description = "Local, reproducible evaluation Core for TRACE."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "TRACE maintainers"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "build>=1.0",
  "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/om-ai-lab/trace-bench"
Documentation = "https://github.com/om-ai-lab/trace-bench#readme"
Issues = "https://github.com/om-ai-lab/trace-bench/issues"

[project.scripts]
trace = "trace_bench.cli:main"
# Compatibility alias from the previous Open Stream Bench name.
osb = "trace_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_bench = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Freeze the original Ruff baseline instead of inheriting future default rules.
select = ["E4", "E7", "E9", "F"]
