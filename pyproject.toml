[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-stream-bench"
version = "0.0.0"
description = "Local, reproducible evaluation Core for Open Stream Bench."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Open Stream Bench maintainers"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "build>=1.0",
  "ruff>=0.9",
]

[project.scripts]
osb = "open_stream_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_stream_bench = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
