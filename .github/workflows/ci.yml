name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -p no:cacheprovider -q
      - name: Lint
        run: ruff check .
      - name: Validate public release
        run: python -m open_stream_bench.cli data validate --release data/releases/v1.1.0
      - name: Build wheel
        run: python -m build
      - name: README end-to-end software flow
        shell: bash
        run: |
          python scripts/make_smoke_fixture.py --output /tmp/osb-smoke
          osb data validate --release /tmp/osb-smoke/release
          for task in qa proactive; do
            osb run --task "$task" --release /tmp/osb-smoke/release --subset tiny \
              --adapter open_stream_bench.adapters:TestDoubleAdapter \
              --video-root /tmp/osb-smoke --output "/tmp/osb-smoke/$task" \
              --synthetic --judge-mode exact --checkpoint-every 5
            osb bundle validate "/tmp/osb-smoke/$task"
            osb score "/tmp/osb-smoke/$task" --judge-mode exact
          done
      - name: Scan for private paths and credentials
        shell: bash
        run: |
          ! rg -n --hidden '10\.[0-9]+\.[0-9]+\.[0-9]+|/data[0-9]+|/training|/vsan|BEGIN (RSA|OPENSSH) PRIVATE KEY|sk-[A-Za-z0-9]{20,}' \
            --glob '!.git/**' \
            --glob '!.github/workflows/ci.yml' \
            --glob '!src/open_stream_bench.egg-info/**' .
